project:
  name: "Amazon ML Challenge 2026 - Entity Resolution"
  experiment_id: "exp01_baseline"
  seed: 42

paths:
  raw_data_dir: "data/raw"
  processed_data_dir: "data/processed"
  candidates_dir: "data/candidates"
  models_dir: "models"
  experiments_dir: "experiments"
  submissions_dir: "submissions"

data:
  source1_filename: "source1.csv"
  source2_filename: "source2.csv"
  source3_filename: "source3.csv"
  train_matches_filename: "train_matches.csv"
  id_column_s1: "s1_id"
  id_column_s2: "s2_id"
  id_column_s3: "s3_id"

blocking:
  top_k: 20
  min_similarity_threshold: 0.1
  blocking_fields: ["name", "address", "phone"]

features:
  string_similarity_metrics: ["levenshtein", "jaccard", "cosine_tfidf"]

modeling:
  model_type: "catboost"  # Options: catboost, lightgbm
  params:
    iterations: 500
    learning_rate: 0.05
    depth: 6
    eval_metric: "Logloss"
    random_seed: 42
  cv_folds: 5

evaluation:
  beta: 0.5

decision:
  threshold: 0.5
  enforce_one_to_one: false

submission:
  output_filename: "submission.csv"
  enforce_s1_coverage: true
  enforce_candidate_subset: true
